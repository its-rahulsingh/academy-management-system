<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ojas Product Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f1f2f8; --ink: #1e2438; --muted: #6b7088; --brand: #5147df; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Manrope, system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px; }
  canvas { width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; box-shadow: 0 20px 60px #1e243833; background: #000; display: block; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 8px; }
  h1 { font-size: 20px; margin: 0 auto 0 0; letter-spacing: -.03em; }
  button { font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; background: #e4e3fb; color: var(--brand); }
  button.primary { background: var(--brand); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=range] { width: 100%; }
  p { font-size: 14px; color: var(--muted); margin: 6px 0; }
  #status { font-weight: 700; color: var(--brand); }
  #chapters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  #chapters button { padding: 6px 10px; font-size: 12px; }
  /* ?embed=1: just the video, filling the frame, playing on a loop (used on the landing page) */
  body.embed { background: #000; overflow: hidden; }
  body.embed main { padding: 0; max-width: none; height: 100vh; display: grid; place-items: center; }
  body.embed main > :not(canvas) { display: none; }
  body.embed canvas { width: 100vw; height: 100vh; aspect-ratio: auto; object-fit: contain; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<main>
  <canvas id="c" width="1920" height="1080"></canvas>
  <div class="bar">
    <h1>Ojas — product tour</h1>
    <button id="play" class="primary">▶ Play</button>
    <button id="restart">↺ Restart</button>
    <button id="record" class="primary">● Record &amp; download video</button>
  </div>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline">
  <p><span id="time">0.0s</span> · <span id="status"></span></p>
  <div id="chapters"></div>
  <p>Recording plays the whole tour once in real time (about 2½ minutes) and downloads an MP4. Keep this tab visible until it finishes.</p>
</main>
<script>
// ---- Edit these to change the closing offer ----------------------------------------------
const CONFIG = {
  academy: 'Sunrise Classes',
  offer: '6 months trial period',
  offerSmall: 'No card needed. We set everything up for you.',
  contact: 'Book your free setup today. Call: +91 8554823947',
};
// ------------------------------------------------------------------------------------------

const W = 1920, H = 1080, FPS = 30;
const C = { brand: '#5147df', brand2: '#6a5cf2', deep: '#16153a', deep2: '#2c2a5a', ink: '#1e2438', muted: '#7d8299',
  light: '#eef0f8', line: '#e8e9f2', soft: '#f6f6fb', green: '#1fa971', red: '#e5484d', orange: '#f08a24', yellow: '#e8b100', amber: '#ffb547', lilac: '#efedff' };
const EMBED = new URLSearchParams(location.search).has('embed');
if (EMBED) document.body.classList.add('embed');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ---------- drawing helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const s = 1.7; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const prog = (lt, at, dur = 0.5) => ease((lt - at) / dur);
const font = (size, weight = 700) => `${weight} ${size}px Manrope, "Segoe UI Emoji", sans-serif`;

function text(str, x, y, o = {}) {
  const { size = 24, weight = 700, color = C.ink, align = 'left', maxW = 0, lh = 1.22, spacing = 0 } = o;
  ctx.save();
  ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'top'; ctx.letterSpacing = spacing + 'px';
  let lines = [String(str)];
  if (maxW) {
    lines = []; let cur = '';
    for (const w of String(str).split(' ')) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
    lines.push(cur);
  }
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * size * lh));
  ctx.restore();
  return lines.length * size * lh;
}
function rr(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function shadow(blur = 40, color = '#1e243826', dy = 14) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetY = dy; }
function noShadow() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
function card(x, y, w, h, r = 18) { ctx.save(); shadow(30, '#1e24381c', 8); rr(x, y, w, h, r, '#fff'); ctx.restore(); rr(x, y, w, h, r, null, C.line, 1.5); }
function enter(lt, at, fn, dist = 30, dur = 0.5) {
  const p = prog(lt, at, dur); if (p <= 0) return;
  ctx.save(); ctx.globalAlpha *= p; ctx.translate(0, (1 - p) * dist); fn(p); ctx.restore();
}
function pop(lt, at, cx, cy, fn, dur = 0.5) {
  const p = clamp((lt - at) / dur); if (p <= 0) return;
  const s = back(p); ctx.save(); ctx.globalAlpha *= clamp(p * 2); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); fn(); ctx.restore();
}
function chip(x, y, label, bg, fg, size = 16, align = 'left') {
  ctx.save(); ctx.font = font(size, 800); const w = ctx.measureText(label).width + size * 1.4, h = size * 1.8; ctx.restore();
  const left = align === 'right' ? x - w : x;
  rr(left, y, w, h, h / 2, bg);
  text(label, left + w / 2, y + size * 0.4, { size, weight: 800, color: fg, align: 'center' });
  return w;
}
function btn(x, y, w, h, label, bg = C.brand, fg = '#fff', size = 18) {
  rr(x, y, w, h, 10, bg); text(label, x + w / 2, y + (h - size) / 2 - 1, { size, weight: 800, color: fg, align: 'center' });
}
function field(x, y, w, label, value, caret) {
  text(label, x, y, { size: 15, weight: 800, color: '#42465f' });
  rr(x, y + 24, w, 48, 10, '#fff', '#dfe1ec', 1.5);
  text(value + (caret ? '|' : ''), x + 14, y + 38, { size: 18, weight: 600 });
}
function avatar(x, y, r, initials, bg = C.lilac, fg = C.brand) {
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  text(initials, x, y - r * 0.45, { size: r * 0.85, weight: 800, color: fg, align: 'center' });
}
function logo(x, y, s) {
  const k = s / 64; ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  const g = ctx.createLinearGradient(0, 0, 64, 64); g.addColorStop(0, '#6a5cf2'); g.addColorStop(1, '#4236c9');
  rr(0, 0, 64, 64, 18, g);
  ctx.beginPath(); ctx.arc(30, 35, 14.5, 0, Math.PI * 2); ctx.strokeStyle = '#fff'; ctx.lineWidth = 7.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(45.5, 18.5, 7.5, 0, Math.PI * 2); ctx.fillStyle = C.amber; ctx.fill(); ctx.strokeStyle = '#5246d8'; ctx.lineWidth = 3.5; ctx.stroke();
  ctx.restore();
}
function academyMark(x, y, s) {
  const g = ctx.createLinearGradient(x, y, x + s, y + s); g.addColorStop(0, '#ff9a3c'); g.addColorStop(1, '#f25c2a');
  rr(x, y, s, s, s * 0.28, g);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + s / 2, y + s * 0.62, s * 0.24, Math.PI, 0); ctx.fill();
  ctx.fillRect(x + s * 0.2, y + s * 0.62, s * 0.6, s * 0.06);
}
function qr(x, y, s, seed) {
  const n = 25, c = s / n; let r = seed * 7919 + 17;
  const rnd = () => { r = (r * 16807) % 2147483647; return r / 2147483647; };
  ctx.fillStyle = C.ink;
  const inF = (i, j) => (i < 8 && j < 8) || (i > n - 9 && j < 8) || (i < 8 && j > n - 9);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (!inF(i, j) && rnd() > 0.52) ctx.fillRect(x + i * c, y + j * c, c + 0.5, c + 0.5);
  for (const [fi, fj] of [[0, 0], [n - 7, 0], [0, n - 7]]) {
    const fx = x + fi * c, fy = y + fj * c;
    ctx.fillStyle = C.ink; ctx.fillRect(fx, fy, 7 * c, 7 * c); ctx.fillStyle = '#fff'; ctx.fillRect(fx + c, fy + c, 5 * c, 5 * c);
    ctx.fillStyle = C.ink; ctx.fillRect(fx + 2 * c, fy + 2 * c, 3 * c, 3 * c);
  }
}
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const clock = secs => [Math.floor(secs / 3600), Math.floor(secs / 60) % 60, secs % 60].map(v => String(v).padStart(2, '0')).join(':');

// A data table: cols = [[label, width, align]], rows = arrays of strings or {draw}
function table(x, y, cols, rows, lt, at = 0.6, rowH = 58) {
  let cx = x;
  cols.forEach(([label, w, align]) => { text(label.toUpperCase(), align === 'right' ? cx + w - 10 : cx + 10, y, { size: 13, weight: 800, color: '#a0a4b8', align: align === 'right' ? 'right' : 'left', spacing: 1 }); cx += w; });
  const total = cols.reduce((a, c) => a + c[1], 0);
  ctx.fillStyle = C.line; ctx.fillRect(x, y + 28, total, 2);
  rows.forEach((row, i) => enter(lt, at + i * 0.12, () => {
    const ry = y + 34 + i * rowH; let rx = x;
    row.forEach((cell, j) => {
      const [, w, align] = cols[j];
      if (typeof cell === 'function') cell(rx, ry, w, rowH);
      else text(cell, align === 'right' ? rx + w - 10 : rx + 10, ry + rowH / 2 - 11, { size: 18, weight: j === 0 ? 800 : 600, color: j === 0 ? C.ink : '#4b5068', align: align === 'right' ? 'right' : 'left' });
      rx += w;
    });
    ctx.fillStyle = C.line; ctx.fillRect(x, ry + rowH - 1, total, 1);
  }, 16));
}
const chipCell = (label, bg, fg) => (x, y, w, h) => chip(x + 10, y + h / 2 - 15, label, bg, fg, 15);

// ---------- frame: app window, phone, left column ----------
const WX = 740, WY = 96, WW = 1110, WH = 890;          // app window
const CX = WX + 260, CY = WY + 84, CW = WX + WW - 30 - CX; // content area
const NAV = [['🏠', 'Dashboard'], ['🎓', 'Students'], ['📝', 'Admissions'], ['💰', 'Fees'], ['👩‍🏫', 'Faculty'], ['🧪', 'Tests'], ['🧾', 'Expenses'], ['📊', 'Reports'], ['🛡️', 'Activity log'], ['⚙️', 'Academy profile']];

function appWindow(lt, active, content, page) {
  enter(lt, 0.15, () => {
    ctx.save(); shadow(80, '#1e243833', 30); rr(WX, WY, WW, WH, 22, '#fff'); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.roundRect(WX, WY, WW, WH, 22); ctx.clip();
    ctx.fillStyle = '#f4f4f9'; ctx.fillRect(WX, WY, WW, 46);
    ['#ff6159', '#ffbd2e', '#28c941'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(WX + 26 + i * 22, WY + 23, 7, 0, Math.PI * 2); ctx.fill(); });
    rr(WX + 380, WY + 10, 350, 26, 13, '#fff'); text(`🔒  ${CONFIG.academy} · Ojas`, WX + 555, WY + 15, { size: 14, weight: 700, color: C.muted, align: 'center' });
    ctx.fillStyle = '#f8f8fc'; ctx.fillRect(WX + 230, WY + 46, WW - 230, WH - 46);
    if (active !== null) {
      ctx.fillStyle = '#fff'; ctx.fillRect(WX, WY + 46, 230, WH - 46); ctx.fillStyle = C.line; ctx.fillRect(WX + 229, WY + 46, 1, WH - 46);
      academyMark(WX + 20, WY + 70, 40);
      text(CONFIG.academy, WX + 70, WY + 72, { size: 16, weight: 800 });
      text('Super Admin', WX + 70, WY + 94, { size: 12, weight: 700, color: '#9ba2b6' });
      NAV.forEach(([ico, label], i) => {
        const ny = WY + 140 + i * 50, on = i === active;
        if (on) rr(WX + 12, ny, 206, 40, 9, C.lilac);
        text(ico, WX + 26, ny + 9, { size: 17 });
        text(label, WX + 58, ny + 10, { size: 16, weight: 700, color: on ? C.brand : '#7b8193' });
      });
      text(page[0], CX, WY + 72, { size: 13, weight: 800, color: '#9699ad', spacing: 1 });
      text(page[1], CX, WY + 92, { size: 30, weight: 800 });
    } else {
      ctx.fillStyle = '#f8f8fc'; ctx.fillRect(WX, WY + 46, WW, WH - 46);
    }
    ctx.restore();
  }, 40, 0.6);
  if (lt > 0.35) { ctx.save(); ctx.beginPath(); ctx.roundRect(WX, WY + 46, WW, WH - 46, [0, 0, 22, 22]); ctx.clip(); content(lt); ctx.restore(); }
}

function phone(x, y, w, h, draw) {
  ctx.save(); shadow(70, '#0b0d2a44', 30); rr(x - 14, y - 14, w + 28, h + 28, 60, '#111322'); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, 48); ctx.clip(); ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, h); draw(); ctx.restore();
  rr(x + w / 2 - 60, y + 14, 120, 28, 14, '#111322');
}

function leftColumn(lt, num, kicker, title, bullets) {
  enter(lt, 0.1, () => text(`${String(num).padStart(2, '0')}  ·  ${kicker}`, 90, 210, { size: 22, weight: 800, color: C.brand, spacing: 3 }));
  let th = 0;
  enter(lt, 0.25, () => { th = text(title, 90, 250, { size: 62, weight: 800, maxW: 600, lh: 1.08 }); });
  th = th || 70;
  let by = 250 + th + 40;
  bullets.forEach((b, i) => {
    const y = by;
    ctx.save(); ctx.font = font(26, 600);
    const lines = Math.ceil(ctx.measureText(b).width / 540) || 1; ctx.restore();
    enter(lt, 0.8 + i * 0.85, () => {
      ctx.fillStyle = '#1fa97122'; ctx.beginPath(); ctx.arc(106, y + 16, 16, 0, Math.PI * 2); ctx.fill();
      text('✓', 106, y + 4, { size: 20, weight: 800, color: C.green, align: 'center' });
      text(b, 138, y, { size: 26, weight: 600, color: '#3c4159', maxW: 540, lh: 1.3 });
    }, 20);
    by += lines * 34 + 26;
  });
}

function lightBg() {
  ctx.fillStyle = C.light; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#5147df0d'; ctx.beginPath(); ctx.arc(1800, 80, 380, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1fa9710d'; ctx.beginPath(); ctx.arc(80, 1040, 360, 0, Math.PI * 2); ctx.fill();
}
function brandBg() {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#6a5cf2'); g.addColorStop(1, '#2f259e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff0d'; ctx.beginPath(); ctx.arc(1700, 180, 420, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(160, 980, 380, 0, Math.PI * 2); ctx.fill();
}
function statCard(x, y, w, h, label, value, color, lt, at) {
  enter(lt, at, (p) => {
    card(x, y, w, h);
    text(label, x + 20, y + 20, { size: 15, weight: 700, color: C.muted });
    const v = typeof value === 'number' ? (value > 999 ? inr(value * p) : String(Math.round(value * p))) : value;
    text(v, x + 20, y + 50, { size: 30, weight: 800, color });
  });
}

// ---------- scenes ----------
function sIntro(lt) {
  brandBg();
  const glow = 0.25 + 0.1 * Math.sin(lt * 3);
  const g = ctx.createRadialGradient(960, 420, 40, 960, 420, 420); g.addColorStop(0, `rgba(255,181,71,${glow})`); g.addColorStop(1, 'rgba(255,181,71,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  pop(lt, 0.1, 960, 400, () => { ctx.save(); shadow(60, '#0b0d2a66', 24); logo(860, 300, 200); ctx.restore(); }, 0.7);
  enter(lt, 0.6, () => text('Ojas', 960, 540, { size: 150, weight: 800, color: '#fff', align: 'center', spacing: -3 }));
  enter(lt, 1.0, () => text('Your whole academy. One app.', 960, 730, { size: 48, weight: 700, color: '#e6e3ff', align: 'center' }));
  enter(lt, 1.6, () => text('PRODUCT TOUR', 960, 830, { size: 24, weight: 800, color: C.amber, align: 'center', spacing: 6 }));
}

function sSignIn(lt) {
  lightBg();
  leftColumn(lt, 1, 'SIGN-IN & ROLES', 'Every person gets the right access.', [
    'Each academy signs in with its own academy code',
    'Super Admin, Admin, Accountant and Staff roles',
    'Faculty and students get their own portals',
    'Five wrong passwords lock an account for 15 minutes']);
  appWindow(lt, null, () => {
    enter(lt, 0.5, () => {
      card(WX + 70, WY + 120, 440, 640, 22);
      academyMark(WX + 250, WY + 160, 80);
      text(CONFIG.academy, WX + 290, WY + 260, { size: 26, weight: 800, align: 'center' });
      text('Sign in to continue', WX + 290, WY + 296, { size: 16, weight: 600, color: C.muted, align: 'center' });
      const typed = (s, at, d) => s.slice(0, Math.floor(clamp((lt - at) / d) * s.length));
      field(WX + 110, WY + 340, 360, 'Academy code', typed('SUNRISE', 1.0, 0.6), lt > 1 && lt < 1.6);
      field(WX + 110, WY + 430, 360, 'Email', typed('admin@sunrise.in', 1.7, 0.8), lt > 1.7 && lt < 2.5);
      field(WX + 110, WY + 520, 360, 'Password', '•'.repeat(Math.floor(clamp((lt - 2.6) / 0.5) * 9)), false);
      btn(WX + 110, WY + 620, 360, 56, lt > 3.4 ? 'Signed in ✓' : 'Sign in', lt > 3.4 ? C.green : C.brand, '#fff', 20);
    });
    const roles = [['Super Admin', 'Everything, including subscription and reports', C.brand],
      ['Admin', 'Day-to-day running of the academy', '#3b82f6'], ['Accountant', 'Fees, refunds, expenses, payouts', C.green],
      ['Staff', 'Students, admissions, fee collection', C.orange], ['Faculty', 'Own portal: clock in, sessions, pay', '#d946ef'],
      ['Student', 'Own portal: subjects, results, report card', '#0ea5e9']];
    roles.forEach(([r, d, col], i) => enter(lt, 1.2 + i * 0.3, () => {
      const y = WY + 120 + i * 108; card(WX + 560, y, 500, 92, 16);
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(WX + 600, y + 46, 14, 0, Math.PI * 2); ctx.fill();
      text(r, WX + 630, y + 18, { size: 20, weight: 800 }); text(d, WX + 630, y + 50, { size: 15, weight: 600, color: C.muted });
    }));
  });
}

function sDashboard(lt) {
  lightBg();
  leftColumn(lt, 2, 'DASHBOARD', 'Your academy at a glance.', [
    'Fees collected, dues and expenses in one view',
    'Classes running right now, with live timers',
    'Switch academic year in one click']);
  appWindow(lt, 0, () => {
    enter(lt, 0.6, () => chip(CX + CW, WY + 96, '2026-27  ▾', C.lilac, C.brand, 15, 'right'));
    const w = (CW - 60) / 4;
    [['Fees collected', 482500, C.green], ['Fees due', 126000, C.red], ['Expenses', 96400, C.orange], ['Active students', 312, C.ink]]
      .forEach(([l, v, c], i) => statCard(CX + i * (w + 20), CY + 70, w, 110, l, v, c, lt, 0.6 + i * 0.12));
    enter(lt, 1.2, () => {
      card(CX, CY + 205, 500, 360);
      text('Fee collection by month', CX + 24, CY + 228, { size: 18, weight: 800 });
      const vals = [42, 55, 48, 70, 64, 82, 76, 92], m = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'];
      vals.forEach((v, i) => {
        const p = prog(lt, 1.4 + i * 0.08, 0.7), bh = v * 2.6 * p, bx = CX + 34 + i * 57;
        rr(bx, CY + 530 - bh, 36, bh, 6, i === 7 ? C.brand : '#c9c4fb');
        text(m[i], bx + 18, CY + 538, { size: 13, weight: 700, color: C.muted, align: 'center' });
      });
    });
    enter(lt, 1.5, () => {
      card(CX + 520, CY + 205, CW - 520, 360);
      text('Classes running now', CX + 544, CY + 228, { size: 18, weight: 800 });
      [['Mr. Iyer', 'Physics · Class 11', 2400], ['Ms. Khan', 'Biology · Class 12', 1260], ['Mr. Rao', 'Maths · Class 9', 300]].forEach(([n, s, base], i) => {
        const y = CY + 280 + i * 92;
        ctx.fillStyle = C.green; ctx.beginPath(); ctx.arc(CX + 552, y + 22, 7, 0, Math.PI * 2); ctx.fill();
        text(n, CX + 570, y, { size: 18, weight: 800 }); text(s, CX + 570, y + 28, { size: 14, weight: 600, color: C.muted });
        text(clock(base + Math.floor(lt * 3)), CX + CW - 22, y + 6, { size: 22, weight: 800, color: C.brand, align: 'right' });
      });
    });
    enter(lt, 1.9, () => {
      card(CX, CY + 585, CW, 205);
      text('Latest payments', CX + 24, CY + 606, { size: 18, weight: 800 });
      [['Priya Patel', 'R-0142 · UPI', 8500], ['Aarav Sharma', 'R-0141 · Cash', 12000], ['Kabir Singh', 'R-0140 · Card', 9500]].forEach(([n, d, a], i) => {
        const y = CY + 645 + i * 46; text(n, CX + 24, y, { size: 17, weight: 800 }); text(d, CX + 260, y, { size: 16, weight: 600, color: C.muted });
        text(inr(a), CX + CW - 24, y, { size: 17, weight: 800, color: C.green, align: 'right' });
      });
    });
  }, ['OVERVIEW', 'Dashboard']);
}

function sStudents(lt) {
  lightBg();
  leftColumn(lt, 3, 'STUDENTS & COURSES', 'Every student, every course, every year.', [

const SCENES = [
  ['Intro', sIntro, 4.5], ['Sign-in & roles', sSignIn, 8.5], ['Dashboard', sDashboard, 8], ['Students', sStudents, 8], ['Admissions', sAdmissions, 9],
  ['Fees', sFees, 10], ['Faculty pay', sFacultyPay, 9], ['Faculty portal', sFacultyPortal, 10], ['Student portal', sStudentPortal, 9], ['Tests', sTests, 9],
  ['Expenses', sExpenses, 9], ['Reports', sReports, 9], ['Activity log', sActivity, 10], ['Promote', sPromote, 9], ['Branding', sBranding, 9], ['Get started', sCta, 7],
];
const STARTS = []; let acc = 0; for (const s of SCENES) { STARTS.push(acc); acc += s[2]; }
const TOTAL = acc, FADE = 0.45;

function progressBar(t) {
  ctx.fillStyle = '#00000014'; ctx.fillRect(0, H - 8, W, 8);
  ctx.fillStyle = C.amber; ctx.fillRect(0, H - 8, W * t / TOTAL, 8);
}

function draw(t) {
  t = clamp(t, 0, TOTAL - 0.001);
  let i = STARTS.length - 1; while (STARTS[i] > t) i--;
  const lt = t - STARTS[i];
  ctx.save();
  if (i > 0 && lt < FADE) { SCENES[i - 1][1](SCENES[i - 1][2]); ctx.globalAlpha = ease(lt / FADE); }
  SCENES[i][1](lt);
  ctx.restore(); noShadow();
  progressBar(t);
}

// ---------- playback & recording ----------
const playBtn = document.getElementById('play'), restartBtn = document.getElementById('restart'), recBtn = document.getElementById('record');
const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), statusEl = document.getElementById('status');
let playing = false, t0 = 0, cur = 0, onEnd = null;
const chapters = document.getElementById('chapters');
SCENES.forEach(([name], i) => { const b = document.createElement('button'); b.textContent = name; b.onclick = () => { cur = STARTS[i] + FADE; if (playing) play(cur); else { draw(cur + 3); cur += 3; show(); } }; chapters.appendChild(b); });

function frame() {
  if (!playing) return;
  cur = (performance.now() - t0) / 1000;
  if (cur >= TOTAL && EMBED) { play(0); return; }
  if (cur >= TOTAL) { cur = TOTAL; playing = false; playBtn.textContent = '▶ Play'; draw(TOTAL); show(); if (onEnd) { const f = onEnd; onEnd = null; f(); } return; }
  draw(cur); show(); requestAnimationFrame(frame);
}
function show() { scrub.value = Math.round(cur / TOTAL * 1000); timeEl.textContent = `${cur.toFixed(1)}s / ${TOTAL.toFixed(0)}s`; }
function play(from = cur) { if (from >= TOTAL) from = 0; t0 = performance.now() - from * 1000; playing = true; playBtn.textContent = '❚❚ Pause'; requestAnimationFrame(frame); }
function pause() { playing = false; playBtn.textContent = '▶ Play'; }
playBtn.onclick = () => playing ? pause() : play();
restartBtn.onclick = () => { cur = 0; play(0); };
scrub.oninput = () => { pause(); cur = scrub.value / 1000 * TOTAL; draw(cur); show(); };

recBtn.onclick = () => {
  const types = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const type = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!type) { statusEl.textContent = 'This browser cannot record video. Use a recent Chrome or Edge.'; return; }
  const rec = new MediaRecorder(canvas.captureStream(FPS), { mimeType: type, videoBitsPerSecond: 12_000_000 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const ext = type.includes('mp4') ? 'mp4' : 'webm', blob = new Blob(chunks, { type: type.split(';')[0] });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `ojas-product-tour.${ext}`; a.click();
    statusEl.textContent = `Saved ojas-product-tour.${ext} (${(blob.size / 1e6).toFixed(1)} MB).` + (ext === 'webm' ? ' This browser made WebM; convert to MP4 for WhatsApp.' : '');
    [playBtn, restartBtn, recBtn, scrub].forEach(b => b.disabled = false);
  };
  [playBtn, restartBtn, recBtn, scrub].forEach(b => b.disabled = true);
  statusEl.textContent = 'Recording… keep this tab visible.';
  draw(0); rec.start(500);
  onEnd = () => setTimeout(() => rec.stop(), 400);
  cur = 0; play(0);
};

Promise.all([800, 700, 600].map(w => document.fonts.load(`${w} 40px Manrope`))).catch(() => {}).then(() => { draw(0); show(); if (EMBED) play(0); });
draw(0); show();
