# Existing Web Service users: configure this in the Render dashboard, no need to recreate the service.
services:
  - type: web
    name: academy-starter
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__AcademyDb
        sync: false # Paste the Neon pooled ADO.NET connection string securely in Render.
