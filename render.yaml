# Render Blueprint: New -> Blueprint in Render creates the "ojas" web service from this file.
# Values marked "sync: false" are secrets Render asks you to paste when the service is created; they never live in git.
# Editing this file does not change a service that was created by hand in the dashboard.
services:
  - type: web
    name: ojas
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__AcademyDb
        sync: false # Paste the Neon pooled ADO.NET connection string (the same one the old service uses).
      - key: OWNER_EMAIL
        sync: false # Platform owner login, created once at first start (already exists if you reuse the database).
      - key: OWNER_PASSWORD
        sync: false # Only used if the owner does not exist yet. Can be removed after the owner has signed in.
      - key: App__PublicBaseUrl
        sync: false # This service's own address, e.g. https://ojas-xxxx.onrender.com — used in emailed links.
      - key: Email__ResendApiKey
        sync: false # Resend API key (re_...). Copy it from the old service.
      - key: Email__FromAddress
        sync: false # Sender address verified in Resend. Copy it from the old service.
      - key: Email__FromName
        value: Ojas
      - key: Subscription__DefaultTrialDays
        value: "0" # New academies start on the Free plan with no trial. The owner can still give a trial when creating one.
